<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>교육 영상</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#17141c;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
    body{display:flex;flex-direction:column;overflow:hidden}.bar{height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:9px;background:linear-gradient(135deg,#ff7548,#f59b31);box-shadow:0 2px 12px #0005;position:relative;z-index:2;flex:none}
    button,a{font:inherit}.back{border:1px solid #ffffff73;background:#ffffff20;color:#fff;border-radius:11px;padding:10px 12px;font-size:14px;font-weight:900;cursor:pointer}.title{min-width:0;text-align:center;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.external{color:#fff;text-decoration:none;font-size:12px;font-weight:800;padding:8px 5px}
    .stage{flex:1;min-height:0;display:grid;place-items:center;padding:12px;background:radial-gradient(circle at 50% 40%,#30273b,#17141c 65%)}.video{width:min(100%,960px);aspect-ratio:16/9;border:0;border-radius:15px;background:#000;box-shadow:0 14px 45px #0008}.error{display:none;text-align:center;padding:35px 20px}.error strong{display:block;font-size:18px;margin-bottom:8px}.error p{font-size:13px;line-height:1.6;color:#c9c2ce}
    @media(max-width:520px){.stage{padding:0 10px}.video{width:100%;border-radius:12px}.external{font-size:11px}.title{font-size:15px}}
  </style>
</head>
<body>
  <header class="bar">
    <button class="back" id="back-btn" type="button" onclick="goBack()">← 교육자료</button>
    <div class="title" id="title">교육 영상</div>
    <a class="external" id="direct" href="#" target="_blank" rel="noopener">유튜브</a>
  </header>
  <main class="stage">
    <iframe class="video" id="viewer" title="교육 영상" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    <div class="error" id="error"><strong>영상을 열 수 없어요</strong><p>교육자료 목록으로 돌아가 영상 주소를 확인해주세요.</p></div>
  </main>
  <script>
    const params=new URLSearchParams(location.search);
    const returnTo=params.get('return')==='roulette'?'roulette':'education';
    const source=params.get('url')||'';
    const title=params.get('title')||'교육 영상';
    let id='';
    try{const u=new URL(source);if(u.hostname==='youtu.be')id=u.pathname.slice(1);else if(/(^|\.)youtube\.com$/.test(u.hostname))id=u.searchParams.get('v')||u.pathname.split('/embed/')[1]||''}catch(e){}
    id=id.split(/[?&#/]/)[0];
    const safe=/^[A-Za-z0-9_-]{11}$/.test(id);
    document.getElementById('title').textContent=title;
    document.getElementById('back-btn').textContent=returnTo==='roulette'?'← 롤플레잉':'← 교육자료';
    document.title=title+' · 교육 영상';
    function goBack(){location.href='index.html?return='+returnTo}
    if(safe){
      document.getElementById('viewer').src='https://www.youtube-nocookie.com/embed/'+id+'?rel=0';
      document.getElementById('direct').href=source;
    }else{
      document.getElementById('viewer').style.display='none';
      document.getElementById('direct').style.display='none';
      document.getElementById('error').style.display='block';
    }
  </script>
</body>
</html>
