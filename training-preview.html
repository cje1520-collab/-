function startGame(m){stop();done=false;paused=false;items=[];hits=0;combo=0;emitted=0;energy=0;remaining=(m.seconds||15)*1000;spawn=0;last=performance.now();$('actions').replaceChildren();$('pause').disabled=false;$('pause').onclick=togglePause;const arena=$('arena');arena.replaceChildren();if(m.type==='match'){match(m);return;}if(m.type==='mole')for(let i=0;i<6;i++)arena.append(e('div',undefined,'mole-hole'));emit(m);emit(m);tick=setInterval(()=>{const now=performance.now(),dt=now-last;last=now;if(paused||document.hidden)return;remaining-=dt;spawn+=dt;$('time').textContent=Math.max(0,Math.ceil(remaining/1000))+'s';if(remaining<=0){finishGame(m);return;}if(spawn>=330){spawn%=330;emit(m);}items=items.filter(item=>{item.age+=dt;if(m.type==='rain')item.node.style.transform='translateY('+(item.age/item.life*(arena.clientHeight+70))+'px)';if(item.age>=item.life){item.node.remove();return false;}return true;});},30);}

function togglePause(){paused=!paused;last=performance.now();$('pause').textContent=paused?'계속하기':'일시정지';$('arena').classList.toggle('paused',paused);$('arena').querySelectorAll('button').forEach(n=>n.disabled=paused||n.dataset.hit==='true');}
function emit(m){const arena=$('arena');let parent=arena,lane=0;if(m.type==='mole'){const holes=[...arena.children].filter(n=>!n.querySelector('button'));if(!holes.length)return;parent=holes[Math.floor(Math.random()*holes.length)];}else{const occupied=items.filter(x=>x.age<460).map(x=>x.lane),lanes=[0,1,2].filter(x=>!occupied.includes(x));if(!lanes.length)return;lane=lanes[Math.floor(Math.random()*lanes.length)];}const word=emitted++%2===0?m.answer:m.wrong[Math.floor(Math.random()*m.wrong.length)];const n=b('',()=>{if(paused||done||n.dataset.hit)return;n.dataset.hit='true';n.disabled=true;if(word===m.answer){hits++;combo++;add(m.xp);$('hits').textContent=hits+' HIT';$('combo').textContent=combo+' COMBO'+(combo>=4?' 🔥':'');n.classList.add('hit');n.querySelector('.word-label').textContent='+'+m.xp;}else{combo=0;window.GameFun.wrong();$('combo').textContent='0 COMBO';n.classList.add('miss');n.querySelector('.word-label').textContent='✕';}later(()=>{n.remove();items=items.filter(x=>x.node!==n);},180);},'critter');n.setAttribute('aria-label',word);if(m.type==='mole')n.innerHTML='<span class="ears"></span><span class="critter-face">• ᴗ •</span>';n.append(e('span',word,'word-label'));if(m.type==='rain'){n.style.left=(lane*33.333+1)+'%';n.style.width='31%';}parent.append(n);items.push({node:n,age:0,life:m.type==='rain'?1850:1000,lane});}

function energyBoard(m){const arena=$('arena');arena.replaceChildren();for(const word of shuffle([m.answer,...m.wrong.slice(0,3)]))arena.append(b(word,()=>{if(paused||done)return;if(word!==m.answer){say(C.feedback.other);return;}hits++;energy=Math.min(100,energy+10);$('charge').style.width=energy+'%';$('charge-label').textContent=energy+'%';$('hits').textContent=hits+' HIT';arena.classList.remove('charged');void arena.offsetWidth;arena.classList.add('charged');if(energy===100){add(30);finishGame(m);}else if(hits%2===0)energyBoard(m);},'energy-word'));}
function match(m){$('hits').textContent='0/'+m.pairs.length+' PAIR';$('time').textContent=m.pairs.length+'쌍';$('arena').className='arena match';$('combo').textContent='';let selected=null,pairs=0,locked=false;const left=e('div',undefined,'pair-column'),right=e('div',undefined,'pair-column');$('arena').append(left,right);for(let side=0;side<2;side++)for(const item of shuffle(m.pairs.map((p,i)=>({word:p[side],id:i})))){const n=b(item.word,()=>{if(paused||done||locked||n.dataset.hit||selected===n)return;n.classList.add('picked');if(!selected){selected=n;return;}if(selected.dataset.pair===n.dataset.pair&&selected.dataset.side!==n.dataset.side){selected.dataset.hit=n.dataset.hit='true';selected.disabled=n.disabled=true;selected.classList.add('matched');n.classList.add('matched');selected=null;pairs++;hits=pairs;add(m.xp);$('hits').textContent=pairs+'/'+m.pairs.length+' PAIR';if(pairs===m.pairs.length)finishGame(m);}else{locked=true;const previous=selected;selected=null;later(()=>{previous.classList.remove('picked');n.classList.remove('picked');locked=false;},180);}},'match-tile');n.dataset.pair=item.id;n.dataset.side=side;(side?right:left).append(n);}}

function finishGame(m){if(done)return;done=true;stop();$('pause').disabled=true;$('arena').classList.remove('paused');$('arena').querySelectorAll('button').forEach(n=>n.disabled=true);say(m.type==='match'?hits+' PAIR · +'+hits*m.xp+' XP':hits+' HIT · +'+hits*m.xp+' XP');nextButton();}

function clear(){window.GameFun.clean();stop();done=true;if(!daySaved){saved.xp+=xp;saved.days[day.id||day.day]=true;daySaved=true;}const stored=persist();app.innerHTML='<div class="center clear-content"><span class="eyebrow">DAY CLEAR</span><div class="stamp" id="stamp"></div><h1>오늘 기억할 것</h1><p class="key" id="clear-key"></p><p id="clear-xp"></p><p class="muted" id="save-note"></p></div><div id="actions"></div>';$('stamp').textContent='DAY '+String(day.day).padStart(2,'0')+' ✓';formatKey($('clear-key'),day.clearKey||day.key);$('clear-xp').textContent='+'+xp+' XP · 누적 '+saved.xp+' XP';$('save-note').textContent=stored?'완료 기록을 저장했어요.':'저장할 수 없어 재접속하면 기록이 사라져요.';window.trainingRecommendation(day,$('actions'));if(day.combo&&!comboSaved)$('actions').append(b(day.combo.title+' 시작',()=>comboRun(day.combo),'primary'));else forwardButtons();$('actions').append(b('DAY 선택',home,'ghost'));window.GameFun.finish(day.key);top();}
function persist(){try{localStorage.setItem(store,JSON.stringify(saved));return true;}catch{return false;}}
function forwardButtons(){const at=C.days.findIndex(d=>d.day===day.day),following=C.days[at+1];if(following)$('actions').append(b('다음 DAY →',()=>intro(following),'primary'));}
function comboRun(config){let at=0,streak=0;const pool=config.questions.map(q=>q.answer);function draw(){const q=config.questions[at];frame(q.question,config.title);$('day').textContent=(at+1)+' / '+config.questions.length;$('progress').style.width=(at/config.questions.length*100)+'%';if(at===0&&config.description)$('task').append(e('p',config.description,'muted'));$('task').append(e('p',streak+' COMBO'+(streak>=4?' 🔥':''),'combo-banner'));const box=e('div',undefined,'choices');$('task').append(box);const opts=shuffle([q.answer,...shuffle(pool.filter(a=>a!==q.answer)).slice(0,2)]);for(const word of opts)box.append(b(word,()=>{if(done)return;if(word!==q.answer){streak=0;say('다시 골라보세요.');$('task').querySelector('.combo-banner').textContent='0 COMBO';return;}done=true;streak++;box.querySelectorAll('button').forEach(n=>n.disabled=true);say(streak+' COMBO'+(streak>=4?' 🔥':''));later(()=>{at++;if(at<config.questions.length)draw();else finish();},180);}));}function finish(){stop();done=true;if(!comboSaved){saved.xp+=config.reward;comboSaved=true;}const stored=persist();frame(config.complete,'COMBO CLEAR');done=true;$('day').textContent='DAY '+String(day.day).padStart(2,'0');$('xp').textContent=config.reward+' XP';$('progress').style.width='100%';if(config.feedback)$('task').append(e('p',config.feedback));$('task').append(e('p','+'+config.reward+' XP · 누적 '+saved.xp+' XP','key'));if(!stored)say('기록을 저장할 수 없어요.');forwardButtons();$('actions').append(b('DAY 선택',home,'ghost'));}draw();}


function recall(preview=false){
 const parts=day.key.split(' = '),left=parts.length>1?parts.shift():day.topic,right=parts.length?parts.join(' = '):day.key;
 frame('마지막으로, 기억나요?');document.querySelector('.recall-point')?.remove();$('day').textContent='마무리 확인';
 const card=e('div',undefined,'recall-card');card.append(e('span',left+' = '),e('span','?', 'recall-gap'));$('task').append(card);
 const others=shuffle(C.days.filter(d=>d.category==='콘텐츠'&&d.key!==day.key).map(d=>{const a=d.key.split(' = ');return a.length>1?a.slice(1).join(' = '):d.key;})).filter(x=>x!==right);
 const box=e('div',undefined,'choices');$('task').append(box);for(const word of shuffle([right,...others.slice(0,2)]))box.append(b(word,()=>{if(done)return;if(word!==right){say(day.key+' · 한 번 더 기억해요.');return;}done=true;box.querySelectorAll('button').forEach(n=>n.disabled=true);card.replaceChildren(e('span',day.key));window.GameFun.finish(day.key);say('맞아요. 이 연결을 기억해요.');$('actions').append(b(preview?'학습으로 돌아가기':'학습 완료',preview?()=>intro(day):clear,'primary'));}));
}

document.addEventListener('visibilitychange',()=>{if(document.hidden&&!done&&$('pause')&&!$('pause').disabled&&!paused)togglePause();});window.addEventListener('pagehide',stop);home();if(new URLSearchParams(location.search).get('preview')==='recall'){day=C.days.find(d=>d.category==='콘텐츠');recall(true);}
})();



</script></body></html>
