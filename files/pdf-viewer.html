<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
  <title>상담력 인사이트</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#292d43;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
    body{display:flex;flex-direction:column}.bar{height:calc(62px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;background:linear-gradient(135deg,#ff7548,#f59b31);color:#fff;box-shadow:0 2px 12px #0004;position:relative;z-index:3;flex:none}
    button,a{font:inherit}.back{border:1px solid #ffffff85;background:#ffffff24;color:#fff;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:900;cursor:pointer}.title{min-width:0;text-align:center;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.external{color:#fff;text-decoration:none;font-size:12px;font-weight:800;padding:9px 4px}
    .stage{flex:1;min-height:0;overflow:auto;padding:14px 12px 88px;display:block;text-align:center;-webkit-overflow-scrolling:touch}.paper{display:inline-block;min-height:60%;background:#fff;box-shadow:0 8px 28px #0008;border-radius:4px;overflow:hidden}.paper canvas{display:block;background:#fff;max-width:none}
    .tools{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;display:flex;align-items:center;gap:7px;padding:7px;border-radius:17px;background:#171923eF;box-shadow:0 8px 26px #0008}.tools button{width:42px;height:42px;border:0;border-radius:12px;background:#fff;color:#312b3a;font-size:18px;font-weight:900;cursor:pointer}.tools button:disabled{opacity:.35}.page{min-width:72px;color:#fff;font-size:13px;font-weight:900}.loading{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 17px;border-radius:14px;background:#171923dc;color:#fff;font-size:14px;font-weight:800;z-index:5}.error{display:none;color:#fff;padding:45px 20px;text-align:center}.error strong{display:block;font-size:19px;margin-bottom:9px}.error p{font-size:14px;line-height:1.6;color:#d5d2da}
    @media(max-width:374px){.bar{grid-template-columns:auto minmax(0,1fr) auto}.back{font-size:13px;padding:9px}.title{font-size:14px}.external{font-size:11px}.stage{padding-left:9px;padding-right:9px}.tools{gap:5px}.tools button{width:40px}}
  </style>
</head>
<body>
  <header class="bar">
    <button class="back" id="back" type="button" onclick="goBack()">← 교육자료</button>
    <div class="title" id="title">상담력 인사이트</div>
    <a class="external" id="direct" href="#" target="_blank" rel="noopener">원본</a>
  </header>
  <main class="stage" id="stage">
    <div class="paper" id="paper"><canvas id="canvas"></canvas></div>
    <div class="error" id="error"><strong>PDF를 열 수 없어요</strong><p>교육자료 목록으로 돌아가 다시 시도해주세요.</p></div>
  </main>
  <nav class="tools" id="tools" aria-label="PDF 페이지 조작">
    <button type="button" id="prev" aria-label="이전 페이지">‹</button>
    <span class="page" id="page">- / -</span>
    <button type="button" id="next" aria-label="다음 페이지">›</button>
    <button type="button" id="minus" aria-label="축소">−</button>
    <button type="button" id="plus" aria-label="확대">＋</button>
  </nav>
  <div class="loading" id="loading">PDF 불러오는 중…</div>
  <script>
    const params=new URLSearchParams(location.search),file=params.get('file')||'',title=params.get('title')||'상담력 인사이트',returnTo=params.get('return')==='counseling-resources'?'counseling-resources':'education';
    const safe=/^(?:insights\/insight-\d{4}-\d{2}\.pdf|brochures\/[A-Za-z0-9._-]+\.pdf)$/.test(file);window.PDF_VIEWER_CONFIG={file,safe};
    document.getElementById('title').textContent=title;document.getElementById('back').textContent=returnTo==='counseling-resources'?'← 상담자료':'← 교육자료';document.title=title+' · 상담 MASTER';
    function goBack(){location.href='index.html?return='+returnTo}
    if(safe)document.getElementById('direct').href=file;else showError();
    function showError(){document.getElementById('loading').style.display='none';document.getElementById('paper').style.display='none';document.getElementById('tools').style.display='none';document.getElementById('error').style.display='block'}
  </script>
  <script type="module">
    const {file,safe}=window.PDF_VIEWER_CONFIG;if(!safe)throw new Error('unsafe pdf path');
    import * as pdfjsLib from './pdfjs/pdf.mjs';
    pdfjsLib.GlobalWorkerOptions.workerSrc='./pdfjs/pdf.worker.mjs';
    let pdf=null,current=1,zoom=1,renderTask=null,resizeTimer=null;
    const stage=document.getElementById('stage'),canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d',{alpha:false});
    async function render(){
      if(!pdf)return;document.getElementById('loading').style.display='block';
      if(renderTask)try{renderTask.cancel()}catch(e){}
      const page=await pdf.getPage(current),base=page.getViewport({scale:1});
      const fit=Math.max(.2,(stage.clientWidth-24)/base.width),cssScale=fit*zoom,view=page.getViewport({scale:cssScale});
      const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.floor(view.width*dpr);canvas.height=Math.floor(view.height*dpr);canvas.style.width=Math.floor(view.width)+'px';canvas.style.height=Math.floor(view.height)+'px';
      renderTask=page.render({canvasContext:ctx,viewport:view,transform:dpr===1?null:[dpr,0,0,dpr,0,0]});
      try{await renderTask.promise}catch(e){if(e?.name!=='RenderingCancelledException')throw e}
      document.getElementById('page').textContent=current+' / '+pdf.numPages;document.getElementById('prev').disabled=current<=1;document.getElementById('next').disabled=current>=pdf.numPages;document.getElementById('loading').style.display='none';stage.scrollTo({top:0,left:Math.max(0,(canvas.clientWidth-stage.clientWidth)/2),behavior:'auto'});
    }
    try{pdf=await pdfjsLib.getDocument(file).promise;await render()}catch(e){showError()}
    document.getElementById('prev').onclick=()=>{if(current>1){current--;render()}};document.getElementById('next').onclick=()=>{if(current<pdf.numPages){current++;render()}};
    document.getElementById('minus').onclick=()=>{zoom=Math.max(.7,Math.round((zoom-.15)*100)/100);render()};document.getElementById('plus').onclick=()=>{zoom=Math.min(2.2,Math.round((zoom+.15)*100)/100);render()};
    addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(render,180)});
  </script>
</body>
</html>
