<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>상담력 인사이트</title>
  <style>
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#f6f2ed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
    .bar{height:calc(58px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 12px 0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:9px;background:linear-gradient(135deg,#ff7548,#f59b31);color:#fff;box-shadow:0 2px 12px #7d4b2826;position:relative;z-index:2}
    button,a{font:inherit}.back{border:1px solid #ffffff73;background:#ffffff20;color:#fff;border-radius:11px;padding:10px 12px;font-size:14px;font-weight:900;cursor:pointer}.title{min-width:0;text-align:center;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.external{color:#fff;text-decoration:none;font-size:12px;font-weight:800;padding:8px 5px}
    iframe{display:block;width:100%;height:calc(100% - 58px - env(safe-area-inset-top));border:0;background:#fff}
    .error{display:none;height:calc(100% - 58px - env(safe-area-inset-top));padding:42px 22px;text-align:center;background:#fff}.error strong{display:block;font-size:18px;margin-bottom:9px}.error p{font-size:13px;line-height:1.6;color:#756f6a}.error a{display:inline-block;margin-top:15px;padding:11px 16px;border-radius:12px;background:#654cc2;color:#fff;text-decoration:none;font-weight:900}
  </style>
</head>
<body>
  <header class="bar">
    <button class="back" type="button" onclick="goBack()">← 교육자료</button>
    <div class="title" id="title">상담력 인사이트</div>
    <a class="external" id="direct" href="#">원본 열기</a>
  </header>
  <iframe id="viewer" title="상담력 인사이트 PDF"></iframe>
  <div class="error" id="error"><strong>PDF를 열 수 없어요</strong><p>교육자료 목록으로 돌아가서 다시 시도해주세요.</p><a href="index.html">상담마스터로 돌아가기</a></div>
  <script>
    const params=new URLSearchParams(location.search);
    const file=params.get('file')||'';
    const title=params.get('title')||'상담력 인사이트';
    const safe=/^insights\/insight-\d{4}-\d{2}\.pdf$/.test(file);
    document.getElementById('title').textContent=title;
    document.title=title+' · 상담력 인사이트';
    function goBack(){if(history.length>1)history.back();else location.href='index.html'}
    if(safe){
      document.getElementById('viewer').src=file;
      document.getElementById('direct').href=file;
    }else{
      document.getElementById('viewer').style.display='none';
      document.getElementById('direct').style.display='none';
      document.getElementById('error').style.display='block';
    }
  </script>
</body>
</html>
